[project]
name = "pharmacy-evaluation"
version = "0.1.0"
description = "Budgeted evaluations, scoring and evidence integrity checks"
requires-python = ">=3.12"
dependencies = ["pharmacy-core", "pharmacy-language", "pharmacy-contracts", "pharmacy-infrastructure", "httpx>=0.28,<1", "groq>=1.7.0", "psycopg[binary]>=3.2,<4"]

[project.scripts]
pharmacy-evaluate = "pharmacy_evaluation.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
