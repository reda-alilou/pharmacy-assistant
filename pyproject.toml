[project]
name = "pharmacy-assistant"
version = "0.1.0"
description = "Pharmacy assistant workspace coordinator"
readme = "README.md"
authors = [
    { name = "Reda Alilou", email = "redaalilou.re@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pharmacy-core",
    "pharmacy-language",
    "pharmacy-contracts",
    "pharmacy-infrastructure",
    "pharmacy-ops",
    "pharmacy-evaluation",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/core", "services/language", "packages/contracts", "packages/infrastructure", "tools/operations", "tools/evaluation"]

[tool.uv.sources]
pharmacy-core = { workspace = true }
pharmacy-language = { workspace = true }
pharmacy-contracts = { workspace = true }
pharmacy-infrastructure = { workspace = true }
pharmacy-ops = { workspace = true }
pharmacy-evaluation = { workspace = true }
