<header class="global"><a class="brand" href="?view=analysis" data-nav>Pharma Analyse</a><nav aria-label="Navigation principale"><a href="?view=analysis" data-nav data-global="analysis">Analyses</a><a href="?view=dashboard" data-nav data-global="dashboard">Tableaux de bord</a><a href="?view=assistant" data-nav data-global="assistant">Assistant pharmacie</a></nav><a class="index" href="index.html" data-nav>Comparer les directions</a></header>
<div class="prototype">Prototype · données de test · aucune action réelle</div>
<main class="workspace" id="main" tabindex="-1"></main>
<dialog id="leaveDialog" aria-labelledby="leaveTitle"><h2 id="leaveTitle">Abandonner les modifications ?</h2><p id="leaveCopy">Vos réglages existent uniquement dans ce prototype. Vous pouvez rester pour les conserver à l’écran.</p><div class="actions"><button id="stay">Rester</button><button class="primary" id="discard">Abandonner</button></div></dialog>
<script>
const main=document.querySelector('main');
const params=new URLSearchParams(location.search);let view=['analysis','dashboard','assistant','system'].includes(params.get('view'))?params.get('view'):'analysis';
let dirty=false,pendingUrl='',dialogAction=null,measure='mean',visual='bars',calculated=true,filter='all',editing=false,order=['means','counts','missing'],conversation=true,followup=false;
const scopeHTML=`<section class="scope" aria-label="Source de l’analyse"><div><strong>TEST CP6 · Observations synthétiques</strong><span>cp6-v1.csv · SYNTHETIC_CP6_REVIEW</span><details><summary>Choisir la source et la version</summary><label for="sourceChoice">Source disponible dans cet aperçu</label><select id="sourceChoice"><option>TEST CP6 · version 1</option></select></details></div><div><strong>Version 1 · figée</strong><span>9 lignes · 8 colonnes</span></div><div><strong>Janvier–février 2026</strong><span>Observations synthétiques</span></div></section>`;
function tabs(active){return `<nav class="document-tabs" aria-label="Documents ouverts"><a href="?view=analysis" data-nav ${active==='analysis'?'aria-current="page"':''}>Analyse · prix par groupe</a><a href="?view=dashboard" data-nav ${active==='dashboard'?'aria-current="page"':''}>Tableau · revue CP6</a><a href="index.html" data-nav>Index des propositions</a></nav>`}
function footer(){return `<footer class="report-footer"><p>Cahier · proposition C</p><p>Source figée, calcul explicite, valeurs exactes consultables.</p></footer>`}
function barRow(label,value,max,secondary=false){return `<div class="bar-row numeric"><span>${label}</span><div class="track"><span class="bar ${secondary?'secondary':''}" style="width:${value/max*100}%"></span></div><span class="right">${value.toFixed(2).replace('.',',')}</span></div>`}
function renderAnalysis(){main.innerHTML=tabs('analysis')+`<div class="title-row"><div><h1>Prix public par groupe</h1><p>Analyse reproductible · définition privée · données de test</p></div><div class="actions"><button data-action="save">Enregistrer l’analyse</button></div></div>${scopeHTML}<nav class="section-nav" aria-label="Dans cette analyse"><a href="#configuration">Configuration</a><a href="#resultats">Résultats</a><a href="#methodes">Méthode et contrôles</a></nav><section class="report-section first" id="configuration"><h2>Définir le calcul</h2><div class="config"><div><label for="measure">Mesure</label><select id="measure"><option value="mean" ${measure==='mean'?'selected':''}>Moyenne</option><option value="sum" ${measure==='sum'?'selected':''}>Somme</option></select></div><div><label for="column">Colonne numérique</label><select id="column"><option>ppv_price_mad</option></select></div><div><label for="group">Regrouper par</label><select id="group"><option>group</option></select></div><div><label for="visual">Visualisation</label><select id="visual"><option value="bars" ${visual==='bars'?'selected':''}>Barres</option><option value="table" ${visual==='table'?'selected':''}>Tableau seul</option></select></div></div><div class="config-bottom"><p>9 lignes · aucun filtre · prix manquants exclus du calcul<br>Le prix zéro est une valeur présente.</p><button class="primary" data-action="calculate">Calculer</button></div><div class="status" id="analysisStatus" role="status" aria-live="polite">${dirty?'Réglages modifiés · définition non enregistrée.':''}</div></section><section class="report-section" id="resultats">${resultHTML()}</section><section class="report-section" id="methodes"><h2>Méthode et contrôles</h2><div class="method"><details><summary>Convention de calcul et provenance</summary><p>La moyenne utilise uniquement les prix présents. Groupe B : 350 ÷ 4 = 87,50 MAD ; groupe A : 60 ÷ 4 = 15,00 MAD. Les 9 lignes de la version 1 sont prises en compte, indépendamment de toute pagination.</p><p>Source : SYNTHETIC_CP6_REVIEW · fichier cp6-v1.csv · observations janvier/février 2026. Ces valeurs inventées ne sont pas des prix de marché.</p></details><details><summary>Valeurs manquantes et signal IQR</summary><p>1 prix manquant sur 9 (11,11 %). 8 prix présents, dont 0. Total 410 MAD ; moyenne 51,25 MAD ; minimum 0 ; maximum 200.</p><p>IQR, type 7 : Q1 = 17,5 ; Q3 = 52,5 ; bornes −35 et 105. Seule l’observation 008, à 200 MAD, est signalée. Ce signal statistique n’est pas une conclusion clinique.</p></details></div></section>${footer()}`}
function resultHTML(){if(!calculated)return `<div class="empty"><h2>Résultats à recalculer</h2><p>Les réglages ont changé. Lancez « Calculer » pour afficher les résultats de cette configuration.</p></div>`;let avg=measure==='mean',b=avg?87.5:350,a=avg?15:60,max=avg?100:400;return `<div class="result-heading"><h2>${avg?'Moyenne':'Somme'} des prix par groupe</h2><span>Version 1 · 9 lignes · aucun filtre</span></div><div class="${visual==='bars'?'result-grid':''}">${visual==='bars'?`<figure class="chart" aria-label="${avg?'Moyenne':'Somme'} des prix : groupe B ${b} MAD, groupe A ${a} MAD"><figcaption>Prix public enregistré · MAD</figcaption><div class="axis numeric"><span>0</span><span>${max/2}</span><span>${max}</span></div><div class="bars">${barRow('B',b,max)}${barRow('A',a,max,true)}</div><p class="chart-note">Prix présents uniquement. Les catégories ne sont pas des classes thérapeutiques.</p></figure>`:''}<div><div class="table-wrap" tabindex="0" role="region" aria-label="Résultats exacts"><table><thead><tr><th scope="col">Groupe</th><th class="right" scope="col">${avg?'Moyenne':'Somme'}<br>MAD</th><th class="right" scope="col">Prix<br>présents</th><th class="right" scope="col">Prix<br>manquants</th></tr></thead><tbody><tr><th scope="row">B</th><td class="right">${b.toFixed(2).replace('.',',')}</td><td class="right">4</td><td class="right">1</td></tr><tr><th scope="row">A</th><td class="right">${a.toFixed(2).replace('.',',')}</td><td class="right">4</td><td class="right">0</td></tr></tbody></table></div><p class="table-caption">Valeurs exactes · 8 prix présents sur 9 lignes</p></div></div>`}
function dashboardFixture(){return filter==='A'?{rows:4,present:4,missing:0,rate:0,mean:15,sum:60,groups:[['A',15,4]]}:filter==='B'?{rows:5,present:4,missing:1,rate:20,mean:87.5,sum:350,groups:[['B',87.5,5]]}:{rows:9,present:8,missing:1,rate:11.11,mean:51.25,sum:410,groups:[['B',87.5,5],['A',15,4]]}}
function widgetHTML(id,d,i){let edit=editing?`<div class="edit-tools"><button data-move="${i}" ${i===0?'disabled':''}>Monter la section</button><button data-down="${i}" ${i===order.length-1?'disabled':''}>Descendre la section</button></div>`:'';let headings={means:'Prix moyen par groupe',counts:'Répartition des observations',missing:'Complétude des prix'};let chart='',table='';if(id==='means'){chart=`<figure class="chart"><figcaption>Moyenne · MAD · prix présents</figcaption><div class="bars">${d.groups.map(g=>barRow(g[0],g[1],100,g[0]==='A')).join('')}</div></figure>`;table=`<table><thead><tr><th>Groupe</th><th class="right">Moyenne MAD</th><th class="right">Présents</th></tr></thead><tbody>${d.groups.map(g=>`<tr><th scope="row">${g[0]}</th><td class="right">${g[1].toFixed(2).replace('.',',')}</td><td class="right">4</td></tr>`).join('')}</tbody></table>`}if(id==='counts'){chart=`<figure class="chart"><figcaption>Nombre de lignes · toutes valeurs de prix</figcaption><div class="bars">${d.groups.map(g=>`<div class="bar-row numeric"><span>${g[0]}</span><div class="track"><span class="bar ${g[0]==='A'?'secondary':''}" style="width:${g[2]/5*100}%"></span></div><span class="right">${g[2]}</span></div>`).join('')}</div></figure>`;table=`<table><thead><tr><th>Groupe</th><th class="right">Lignes</th><th class="right">Part</th></tr></thead><tbody>${d.groups.map(g=>`<tr><th scope="row">${g[0]}</th><td class="right">${g[2]}</td><td class="right">${(g[2]/d.rows*100).toFixed(2).replace('.',',')} %</td></tr>`).join('')}</tbody></table>`}if(id==='missing'){chart=`<figure class="chart"><figcaption>Prix manquants · ${d.rate.toFixed(2).replace('.',',')} % des ${d.rows} lignes</figcaption><div class="missing-strip" role="img" aria-label="${d.missing} prix manquant et ${d.present} prix présents"><span class="missing" style="width:${d.rate}%"></span></div><div class="legend"><span><i class="key"></i>Manquants</span><span><i class="key present"></i>Présents</span></div></figure>`;table=`<table><thead><tr><th>État du prix</th><th class="right">Lignes</th><th class="right">Part</th></tr></thead><tbody><tr><th scope="row">Présent</th><td class="right">${d.present}</td><td class="right">${(d.present/d.rows*100).toFixed(2).replace('.',',')} %</td></tr><tr><th scope="row">Manquant</th><td class="right">${d.missing}</td><td class="right">${d.rate.toFixed(2).replace('.',',')} %</td></tr></tbody></table>`}return `<section class="brief-row" id="widget-${id}"><div class="brief-row-head"><h2>${headings[id]}</h2><button class="inline-link" data-inspect="${id}" aria-expanded="false">Inspecter</button></div>${edit}<div class="widget-content">${chart}<div class="table-wrap" tabindex="0" role="region" aria-label="Valeurs exactes : ${headings[id]}">${table}</div></div><div class="notice" id="inspect-${id}" hidden>${id==='means'?'Mesure : moyenne de ppv_price_mad. Regroupement : group. Les prix manquants sont exclus ; les zéros sont inclus.':id==='counts'?'Mesure : nombre de lignes. Regroupement : group. Les lignes avec prix manquant restent incluses.':'Mesure : prix manquants ÷ toutes les lignes du périmètre. Un prix nul (0) reste présent.'}<br>Source : TEST CP6 · version 1 · ${d.rows} lignes ${filter==='all'?'sans filtre':`avec group = ${filter}`}.</div></section>`}
function renderDashboard(){let d=dashboardFixture();main.innerHTML=tabs('dashboard')+`<div class="title-row"><div><h1>Revue des observations CP6</h1><p>Tableau de bord privé · trois lectures d’une même version</p></div><div class="actions"><button data-action="edit-dashboard">${editing?'Terminer la disposition':'Modifier la disposition'}</button><button data-action="save">Enregistrer</button></div></div>${scopeHTML}<div class="dashboard-toolbar"><div class="filter"><label for="filter">Périmètre · group</label><select id="filter"><option value="all" ${filter==='all'?'selected':''}>Tous les groupes</option><option value="A" ${filter==='A'?'selected':''}>Groupe A</option><option value="B" ${filter==='B'?'selected':''}>Groupe B</option></select></div><p class="small muted" style="margin:0">${d.rows} lignes · ${d.present} prix présents · ${d.missing} manquant${d.missing>1?'s':''}<br>Le filtre s’applique aux trois sections.</p></div><div class="status" id="dashboardStatus" role="status" aria-live="polite">${editing?'Disposition locale : déplacez les sections avec les boutons.':''}</div><div class="brief-layout"><div class="brief-main">${order.map((id,i)=>widgetHTML(id,d,i)).join('')}</div><aside class="brief-context" aria-label="Contexte de lecture"><h2>Cadre de lecture</h2><p>Les prix de ce jeu sont inventés pour une revue fonctionnelle. Ils n’indiquent ni le marché actuel ni une valeur thérapeutique.</p><dl><div><dt>Version utilisée</dt><dd>cp6-v1.csv · v1</dd></div><div><dt>Périmètre affiché</dt><dd>${filter==='all'?'Aucun filtre':`group = ${filter}`}</dd></div><div><dt>Moyenne du périmètre</dt><dd class="numeric">${d.mean.toFixed(2).replace('.',',')} MAD</dd></div><div><dt>Somme des prix présents</dt><dd class="numeric">${d.sum.toFixed(2).replace('.',',')} MAD</dd></div></dl><details><summary>Traçabilité et accès</summary><p>SYNTHETIC_CP6_REVIEW · janvier/février 2026. Les trois sections utilisent la même version figée. Un partage de résultats n’autorise pas à explorer les lignes sources.</p></details></aside></div>${footer()}`}
function renderAssistant(){main.innerHTML=`<div class="consultation"><div class="document-tabs"><a href="?view=assistant" data-nav aria-current="page">Consultation temporaire</a><a href="index.html" data-nav>Index des propositions</a></div><div class="title-row"><div><h1>Assistant pharmacie</h1><p>Informations enregistrées · exemple de réponse issu d’une fixture</p></div><button class="quiet" data-action="reset">Nouvelle conversation</button></div><p class="temporary">Conversation temporaire · expiration après 30 min d’inactivité</p>${conversation?`<section class="question" aria-label="Votre question"><span class="small">Votre question · présentation précisée</span><p>Quel est le prix d’ABIP 15 mg, boîte de 30 comprimés ?</p></section><article class="identity" aria-label="Réponse enregistrée"><h2>ABIP · 15 mg</h2><p>Aripiprazole · boîte de 30 comprimés pelliculés</p><div class="table-wrap fact-table" tabindex="0" role="region" aria-label="Fiche de la présentation"><table><tbody><tr><th scope="row">Prix public enregistré</th><td class="numeric">372,00 MAD</td></tr><tr><th scope="row">Forme</th><td>Comprimés pelliculés</td></tr><tr><th scope="row">Présentation</th><td>Boîte de 30 comprimés pelliculés</td></tr><tr><th scope="row">Statut enregistré</th><td>Commercialisé</td></tr></tbody></table></div><p class="stock">Stock non vérifié</p></article><section class="source-record" aria-label="Source de la réponse"><div><p><strong>AMMPS</strong> · observation du 18 octobre 2026</p><p class="muted">Prix daté de la source, sans garantie de prix actuel ni de disponibilité.</p></div><details><summary>Consulter la référence</summary><p>Enregistrement 9080 · collecte le 18/10/2026 à 16:17 UTC.</p><p class="source-url">ammps.gov.ma/basesdedonnes/liste_marocaine_des_medicaments?page=1</p><p>Exemple local : apps/web/tests/fixtures/responses.json. Aucun accès à la source n’est lancé.</p></details></section>${followup?`<section class="followup"><p class="small muted">Question suivante · exemple simulé</p><h3>Et pour deux boîtes complètes ?</h3><p class="numeric">2 × 372,00 MAD = <strong>744,00 MAD</strong>.</p><p class="small muted">Même présentation : ABIP 15 mg, boîte de 30. Calcul illustratif fondé sur le prix public enregistré.</p></section>`:''}`:`<section class="empty"><h2>La conversation a été réinitialisée</h2><p>Dans ce prototype, le contexte a été retiré de l’écran uniquement. Posez une question ou rechargez l’exemple local.</p><button data-action="restore">Recharger l’exemple ABIP</button></section>`}<form class="composer" id="questionForm"><h2>${conversation?'Poursuivre la consultation':'Poser une question'}</h2><label for="question">Votre prochaine question</label><textarea id="question" dir="auto" placeholder="Par exemple : et pour deux boîtes complètes ?" required></textarea><div class="composer-bottom"><p>Simulation locale · aucune question transmise.<br>Le contexte sélectionné reste visible ci-dessus.</p><button class="primary" type="submit">Poser la question</button></div></form><div class="status" id="assistantStatus" role="status" aria-live="polite"></div>${footer()}</div>`}
function renderSystem(){main.innerHTML=`<h1>Cahier · système candidat</h1><p>Une composition de rapport, portée par la typographie et l’alignement des données.</p><section class="report-section"><h2>Palette</h2><div class="system-grid">${[['Fond','#fffefa'],['Encre','#252822'],['Action','#792f37'],['Donnée secondaire','#866018'],['Surface','#f3f1eb'],['Focus','#1b5975']].map(([n,c])=>`<div><div class="swatch" style="background:${c}"></div><strong>${n}</strong> · ${c}</div>`).join('')}</div></section><section class="report-section"><h2>Contrôles et états</h2><div class="actions"><button class="primary" data-action="save">Action principale</button><button data-action="save">Action secondaire</button><button disabled>Indisponible</button></div><div class="notice error" role="alert">Exemple d’erreur : la source n’est pas disponible. Réessayez après sa restauration.</div><div class="notice">Exemple d’attente : calcul en cours… les anciens résultats sont retirés.</div><div class="empty"><h3>Aucun résultat dans ce périmètre</h3><p>Retirez un filtre pour élargir la sélection, puis relancez le calcul.</p></div><details><summary>Disclosure de méthode</summary><p>Les prix manquants sont exclus. Zéro reste une valeur présente.</p></details><div class="status" id="systemStatus" role="status"></div></section>${footer()}`}
function render(){document.querySelectorAll('[data-global]').forEach(a=>{if(a.dataset.global===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});({analysis:renderAnalysis,dashboard:renderDashboard,assistant:renderAssistant,system:renderSystem}[view])();document.title=(view==='assistant'?'Assistant pharmacie':view==='dashboard'?'Revue CP6':'Prix par groupe')+' · Cahier · Prototype'}
function announce(message){let el=document.querySelector('.status');if(el)el.textContent=message}
function showDialog(title,copy,action){document.querySelector('#leaveTitle').textContent=title;document.querySelector('#leaveCopy').textContent=copy;dialogAction=action;document.querySelector('#leaveDialog').showModal();document.querySelector('#stay').focus()}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav&&dirty){e.preventDefault();pendingUrl=nav.href;showDialog('Abandonner les modifications ?','Vos réglages existent uniquement dans ce prototype. Rester les conserve à l’écran ; abandonner permet de quitter.',()=>{dirty=false;location.href=pendingUrl});return}let button=e.target.closest('button');if(!button)return;let action=button.dataset.action;if(action==='save')announce('Simulation : aucune action réelle. La définition n’est pas enregistrée ; vos réglages restent en mémoire jusqu’au départ.');if(action==='calculate'){button.disabled=true;button.textContent='Calcul en cours…';document.querySelector('#resultats').innerHTML='<div class="notice" role="status">Calcul des résultats prédéfinis de la fixture…</div>';setTimeout(()=>{calculated=true;renderAnalysis();announce('Simulation : résultats prédéfinis affichés. Aucune requête ni sauvegarde réelle.');document.querySelector('[data-action="calculate"]').focus()},350)}if(action==='edit-dashboard'){editing=!editing;renderDashboard()}if(button.dataset.move!==undefined){let i=Number(button.dataset.move);[order[i-1],order[i]]=[order[i],order[i-1]];dirty=true;renderDashboard();announce('Section déplacée dans cette vue. Disposition non enregistrée.')}if(button.dataset.down!==undefined){let i=Number(button.dataset.down);[order[i+1],order[i]]=[order[i],order[i+1]];dirty=true;renderDashboard();announce('Section déplacée dans cette vue. Disposition non enregistrée.')}if(button.dataset.inspect){let target=document.querySelector('#inspect-'+button.dataset.inspect);target.hidden=!target.hidden;button.setAttribute('aria-expanded',String(!target.hidden));button.textContent=target.hidden?'Inspecter':'Fermer les détails'}if(action==='reset')showDialog('Abandonner cette conversation ?','Simulation : la conversation sera retirée de cette page uniquement. Aucune session serveur ne sera modifiée.',()=>{conversation=false;followup=false;renderAssistant();announce('Simulation : contexte de conversation retiré de la page.');main.focus()});if(action==='restore'){conversation=true;followup=false;renderAssistant();announce('Exemple ABIP rechargé depuis le contenu local.')}});
document.addEventListener('change',e=>{if(['measure','column','group','visual'].includes(e.target.id)){if(e.target.id==='measure')measure=e.target.value;if(e.target.id==='visual')visual=e.target.value;dirty=true;calculated=false;document.querySelector('#resultats').innerHTML=resultHTML();announce('Configuration modifiée. Les résultats précédents ont été retirés ; lancez Calculer.')}if(e.target.id==='filter'){filter=e.target.value;renderDashboard();announce('Filtre appliqué aux trois sections avec les résultats prédéfinis de la fixture.')}});
document.addEventListener('submit',e=>{if(e.target.id!=='questionForm')return;e.preventDefault();let question=document.querySelector('#question').value.trim();if(!question)return;if(conversation&&/deux|\b2\b/i.test(question)){followup=true;renderAssistant();announce('Simulation : exemple prévu pour deux boîtes affiché. Aucune interprétation distante.')}else{announce('Simulation : aucune question transmise. Cet exemple local illustre uniquement la suite « et pour deux boîtes complètes ? ».')}});
document.querySelector('#stay').addEventListener('click',()=>{document.querySelector('#leaveDialog').close();dialogAction=null});document.querySelector('#discard').addEventListener('click',()=>{document.querySelector('#leaveDialog').close();const callback=dialogAction;dialogAction=null;if(callback)callback()});document.querySelector('#leaveDialog').addEventListener('cancel',()=>{dialogAction=null});
render();
</script>
