[project]
name = "pharmacy-infrastructure"
version = "0.1.0"
description = "Pharmacy assistant infrastructure package"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3,<2",
    "pydantic>=2.13.5,<3",
    "sqlalchemy>=2.0,<3"
]

[project.optional-dependencies]
migrations = ["alembic>=1.13,<2"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
