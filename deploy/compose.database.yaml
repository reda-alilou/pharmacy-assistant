name: pharmacy-assistant-architecture
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run database_setup init-env first}
      POSTGRES_USER: ${POSTGRES_USER:?Run database_setup init-env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run database_setup init-env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
