pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 32k;
        client_body_timeout 10s;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location = /api { return 308 /api/; }
        location = /platform-api { return 308 /platform-api/; }
        location /platform-api/ {
            client_max_body_size 10m;
            set $platform http://platform:3000;
            rewrite ^/platform-api/(.*)$ /$1 break;
            proxy_pass $platform;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_send_timeout 10s;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            error_page 502 503 504 =503 @platform_unavailable;
        }
        location @platform_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"error":{"code":"platform_unavailable","message":"Le service de comptes est temporairement indisponible. Réessayez manuellement."}}';
        }
        location /api/ {
            # Re-resolve core after container replacement; never replay POSTs.
            set $core http://core:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $core;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 170s;
            proxy_send_timeout 10s;
            proxy_next_upstream off;
            proxy_buffering off;
            # Preserve application errors/cooldowns; replace only nginx failures.
            proxy_intercept_errors off;
            error_page 502 503 504 =503 @core_unavailable;
        }
        location @core_unavailable {
            default_type application/json;
            return 503 '{"detail":{"code":"core_unavailable","message":"Le service est temporairement indisponible. Réessayez manuellement ; la demande a pu être traitée.","retryable":true,"retry_after_seconds":null}}';
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control "no-store";
            try_files $uri $uri/ /index.html;
        }
    }
}
