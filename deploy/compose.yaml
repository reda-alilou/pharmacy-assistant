name: pharmacy-assistant-architecture

x-python-runtime: &python-runtime
  init: true
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: "no"
  stop_grace_period: 170s

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run compose_setup first}
      POSTGRES_USER: ${POSTGRES_USER:?Run compose_setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run compose_setup first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  core:
    <<: *python-runtime
    image: pharmacy-assistant-core:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
      target: core
    environment:
      STORAGE_BACKEND: postgres
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:?Run compose_setup first}
      LANGUAGE_SERVICE_URL: http://language:8001
      LANGUAGE_SERVICE_TIMEOUT_SECONDS: "160"
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 12

  language:
    <<: *python-runtime
    image: pharmacy-assistant-language:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
      target: language
    environment:
      STORAGE_BACKEND: postgres
      LANGUAGE_DATABASE_URL: ${LANGUAGE_DATABASE_URL:?Run compose_setup first}
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:?Run compose_setup first}
      INFERENCE_MIN_INTERVAL_SECONDS: ${INFERENCE_MIN_INTERVAL_SECONDS:-0}
      INFERENCE_QUOTA_SCOPE: ${INFERENCE_QUOTA_SCOPE:-default}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GROQ_OUTPUT_MODE: ${GROQ_OUTPUT_MODE:-json_object}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-20}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-1200}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-4096}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-glm-5.3-flash-free}
      OPENCODE_OUTPUT_MODE: ${OPENCODE_OUTPUT_MODE:-json_schema}
      OPENCODE_TIMEOUT_SECONDS: ${OPENCODE_TIMEOUT_SECONDS:-30}
      OPENCODE_MAX_COMPLETION_TOKENS: ${OPENCODE_MAX_COMPLETION_TOKENS:-2048}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 12

  web:
    image: pharmacy-assistant-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      core: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  database-setup:
    <<: *python-runtime
    profiles: ["tools"]
    image: pharmacy-assistant-database-tools:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python
      target: database-tools
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Run compose_setup first}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:?Run compose_setup first}
      LANGUAGE_DATABASE_URL: ${LANGUAGE_DATABASE_URL:?Run compose_setup first}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?Run compose_setup first}
      LANGUAGE_DB_PASSWORD: ${LANGUAGE_DB_PASSWORD:?Run compose_setup first}
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  # Same project and volume as checkpoint 2: no copy, reset, or re-import.
  postgres_data:
