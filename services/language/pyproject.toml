[project]
name = "pharmacy-language"
version = "0.1.0"
description = "Pharmacy assistant language package"
requires-python = ">=3.12"
dependencies = [
    "pharmacy-contracts",
    "pharmacy-infrastructure",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.53.0"
]

[project.optional-dependencies]
migrations = ["pharmacy-infrastructure[migrations]"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
