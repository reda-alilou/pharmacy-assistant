[project]
name = "pharmacy-ops"
version = "0.1.0"
description = "Explicit pharmacy administration and offline verification tools"
requires-python = ">=3.12"
dependencies = ["pharmacy-core[migrations]", "pharmacy-language[migrations]", "pharmacy-contracts", "pharmacy-infrastructure[migrations]", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4"]

[project.scripts]
pharmacy-db = "pharmacy_ops.database:main"
pharmacy-backup = "pharmacy_ops.backup:main"
pharmacy-compose-setup = "pharmacy_ops.compose_setup:main"
pharmacy-compose-verify = "pharmacy_ops.compose_verify:main"
pharmacy-export-contract = "pharmacy_ops.export_contract:main"
pharmacy-fixtures = "pharmacy_ops.fixtures:main"
pharmacy-quota = "pharmacy_ops.quota:main"
pharmacy-check = "pharmacy_ops.checks:main"
pharmacy-archive = "pharmacy_ops.archive:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
